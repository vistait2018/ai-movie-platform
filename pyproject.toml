[project]
name = "ai-movie-school"
version = "0.1.0"
description = "Shared backend for AI Movie Streaming and Creator Platform"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3", "psycopg[binary]>=3.2,<4", "redis>=5.2,<7", "celery[redis]>=5.5,<6"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "bandit>=1.8,<2", "pip-audit>=2.8,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
cache_dir = ".test-cache"
markers = ["integration: requires running PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".venv-dev", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
